name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # node-sword-interface compiles a native addon on install; it needs the
      # libsword build toolchain. Must run before `npm ci`.
      - name: Install libsword build toolchain
        run: |
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt
          sudo timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout 5m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y \
            build-essential cmake pkg-config subversion \
            ffmpeg libcurl4-openssl-dev libicu-dev zlib1g-dev

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: npm ci

      - name: Build and test shared Scripture library
        run: |
          npm -w shared run build
          npm -w shared test

      - name: Typecheck client
        working-directory: client
        run: npx vue-tsc --noEmit

      - name: Test client
        working-directory: client
        run: npm test

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit

      - name: Test server
        working-directory: server
        run: npm test

      - name: Validate Helm chart
        run: ./scripts/test-helm.sh

      - name: Validate Docker Compose profiles
        run: ./scripts/test-compose.sh

      - name: Build
        run: npm run build

      - name: Build container image
        run: docker build --tag machaira:compose-ci .

      - name: Smoke test Docker Compose stack
        env:
          MACHAIRA_COMPOSE_SMOKE: "1"
          MACHAIRA_SMOKE_IMAGE: machaira:compose-ci
        run: ./scripts/test-compose.sh
