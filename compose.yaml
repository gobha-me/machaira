name: machaira

services:
  machaira:
    image: "${MACHAIRA_IMAGE:-ghcr.io/gobha-me/machaira}:${MACHAIRA_VERSION:-0.19.1}"
    pull_policy: missing
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: "${MACHAIRA_ENV_FILE:-.env}"
        required: true
      - path: "./deploy/compose/profiles/${COMPOSE_PROFILES:-app}.env"
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5274"
      MACHAIRA_DB_PATH: /app/server/data/machaira.sqlite
    ports:
      - "${MACHAIRA_BIND_ADDRESS:-127.0.0.1}:${MACHAIRA_PORT:-5274}:5274"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - machaira-data:/app/server/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5274/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    cpus: "1.0"
    mem_limit: 1g
    networks:
      - machaira

  embeddings:
    image: "${MACHAIRA_EMBEDDINGS_IMAGE:-ollama/ollama:0.32.15}"
    profiles: [embeddings, easy]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
    volumes:
      - embedding-model-cache:/models
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD-SHELL, "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    cpus: "2.0"
    mem_limit: 2g
    networks:
      - machaira

  embeddings-model:
    image: "${MACHAIRA_EMBEDDINGS_IMAGE:-ollama/ollama:0.32.15}"
    profiles: [embeddings, easy]
    restart: "on-failure:5"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      embeddings:
        condition: service_healthy
    environment:
      HOME: /tmp
      OLLAMA_HOST: http://embeddings:11434
      EMBEDDING_MODEL: "${MACHAIRA_EMBEDDING_MODEL:-all-minilm:22m}"
    entrypoint: [/bin/sh, -ec]
    command: ['ollama pull "$${EMBEDDING_MODEL}"']
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "0.5"
    mem_limit: 256m
    networks:
      - machaira

  stt:
    image: "${MACHAIRA_STT_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cpu}"
    profiles: [stt, voice, easy]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ENABLE_UI: "false"
      LOG_LEVEL: warning
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__TTL: "-1"
    volumes:
      - stt-model-cache:/home/ubuntu/.cache/huggingface
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 60
    cpus: "2.0"
    mem_limit: 4g
    networks:
      - machaira

  stt-model:
    image: "${MACHAIRA_STT_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cpu}"
    profiles: [stt, voice, easy]
    restart: "on-failure:5"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      stt:
        condition: service_healthy
    environment:
      STT_MODEL: "${MACHAIRA_STT_MODEL:-Systran/faster-whisper-small}"
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        curl --fail --silent --show-error --request POST
        "http://stt:8000/v1/models/$${STT_MODEL}" >/dev/null
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: "0.25"
    mem_limit: 256m
    networks:
      - machaira

  tts:
    image: "${MACHAIRA_TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0}"
    profiles: [tts, voice, easy]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      API_LOG_LEVEL: WARNING
      ENABLE_DEBUG_ENDPOINTS: "false"
      ALLOW_DEV_UNLOAD: "false"
    tmpfs:
      # Kokoro copies libespeak-ng here and loads it dynamically.
      - /tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 60
    cpus: "2.0"
    mem_limit: 4g
    networks:
      - machaira

networks:
  machaira:
    driver: bridge

volumes:
  machaira-data:
  embedding-model-cache:
  stt-model-cache:
