image:
  repository: ghcr.io/gobha-me/machaira
  pullPolicy: IfNotPresent
  tag: ""
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: machaira.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: machaira-tls

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

secret:
  existingSecret: machaira
  key: MACHAIRA_SECRET_KEY

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

tts:
  sidecar:
    enabled: false
    image:
      repository: ghcr.io/remsky/kokoro-fastapi-cpu
      tag: v0.8.0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

stt:
  sidecar:
    enabled: false
    image:
      repository: ghcr.io/speaches-ai/speaches
      tag: 0.8.3-cpu
      pullPolicy: IfNotPresent
    model: Systran/faster-whisper-small
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}
