apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "machaira.fullname" . }}
  labels:
    {{- include "machaira.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "machaira.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "machaira.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: machaira
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 5274
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "5274"
            - name: MACHAIRA_DB_PATH
              value: /app/server/data/machaira.sqlite
            - name: MACHAIRA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secret.existingSecret is required" .Values.secret.existingSecret }}
                  key: {{ required "secret.key is required" .Values.secret.key }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/server/data
            - name: tmp
              mountPath: /tmp
        {{- if .Values.tts.sidecar.enabled }}
        - name: tts
          image: "{{ .Values.tts.sidecar.image.repository }}:{{ .Values.tts.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.tts.sidecar.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: tts
              containerPort: 8880
              protocol: TCP
          env:
            - name: API_LOG_LEVEL
              value: WARNING
            - name: ENABLE_DEBUG_ENDPOINTS
              value: "false"
            - name: ALLOW_DEV_UNLOAD
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: tts
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: tts
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.tts.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- if .Values.stt.sidecar.enabled }}
        - name: stt
          image: "{{ .Values.stt.sidecar.image.repository }}:{{ .Values.stt.sidecar.image.tag }}"
          imagePullPolicy: {{ .Values.stt.sidecar.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: stt
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENABLE_UI
              value: "false"
            - name: LOG_LEVEL
              value: warning
            - name: WHISPER__INFERENCE_DEVICE
              value: cpu
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: WHISPER__TTL
              value: "-1"
            - name: STT_MODEL
              value: {{ .Values.stt.sidecar.model | quote }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    until curl --fail --silent http://127.0.0.1:8000/health >/dev/null; do sleep 2; done;
                    curl --fail --silent --request POST
                    "http://127.0.0.1:8000/v1/models/${STT_MODEL}" >/dev/null
          startupProbe:
            httpGet:
              path: /health
              port: stt
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                    curl --fail --silent http://127.0.0.1:8000/v1/models |
                    grep --fixed-strings --quiet "${STT_MODEL}"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.stt.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/ubuntu/.cache/huggingface
              subPath: stt-model-cache
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "machaira.dataClaim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
