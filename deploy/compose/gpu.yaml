services:
  embeddings:
    image: "${MACHAIRA_EMBEDDINGS_GPU_IMAGE:-ollama/ollama:0.32.15}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  stt:
    image: "${MACHAIRA_STT_GPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cuda}"
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  stt-model:
    image: "${MACHAIRA_STT_GPU_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-cuda}"

  tts:
    image: "${MACHAIRA_TTS_GPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:v0.8.0}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
